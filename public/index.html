<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vyapar Mitra</title>
<style>
  :root {
    --bg: #060a14;
    --bg-panel: #0b1120;
    --border: #1c2740;
    --cyan: #4dd9e8;
    --cyan-dim: #2a7f8c;
    --text: #e6ecf5;
    --text-dim: #8c9bb5;
    --green: #5ee0a5;
    --amber: #f0b95e;
    --red: #f07d7d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: radial-gradient(ellipse at top, #0d1526 0%, var(--bg) 60%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
  }
  .wrap { max-width: 960px; margin: 0 auto; padding: 48px 24px 80px; }

  header { text-align: center; margin-bottom: 40px; }
  h1 {
    font-size: clamp(28px, 4vw, 40px);
    margin: 12px 0 8px;
    letter-spacing: 0.02em;
  }

  .panel {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 28px;
    margin-bottom: 24px;
  }

  .field-tip { margin: 0 0 10px; font-size: 12.5px; color: var(--text-dim); }

  textarea {
    width: 100%;
    min-height: 120px;
    background: #050810;
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    padding: 14px 16px;
    font-size: 15px;
    line-height: 1.5;
    resize: vertical;
    font-family: inherit;
  }
  textarea:focus { outline: none; border-color: var(--cyan-dim); }

  .examples { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .chip {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 6px 12px;
    border-radius: 999px;
    font-size: 12.5px;
    cursor: pointer;
    transition: border-color 0.15s, color 0.15s;
  }
  .chip:hover { border-color: var(--cyan-dim); color: var(--cyan); }

  .row { display: flex; justify-content: flex-end; align-items: center; margin-top: 18px; gap: 12px; }

  button.primary {
    background: var(--cyan);
    color: #04121a;
    border: none;
    padding: 12px 26px;
    border-radius: 10px;
    font-weight: 700;
    font-size: 14.5px;
    cursor: pointer;
    letter-spacing: 0.02em;
    transition: transform 0.1s, box-shadow 0.15s;
    white-space: nowrap;
  }
  button.primary:hover { box-shadow: 0 0 24px rgba(77, 217, 232, 0.35); }
  button.primary:active { transform: scale(0.98); }
  button.primary:disabled { opacity: 0.5; cursor: not-allowed; box-shadow: none; }

  button.secondary {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 12px 28px;
    border-radius: 10px;
    font-weight: 700;
    font-size: 14.5px;
    cursor: pointer;
    letter-spacing: 0.02em;
    transition: border-color 0.15s, color 0.15s, background 0.15s;
  }
  button.secondary:hover { border-color: var(--cyan-dim); color: var(--cyan); background: rgba(77, 217, 232, 0.06); }
  .export-row { display: flex; justify-content: center; margin-top: 4px; }

  #error {
    display: none;
    background: rgba(240, 125, 125, 0.08);
    border: 1px solid rgba(240, 125, 125, 0.35);
    color: var(--red);
    padding: 14px 16px;
    border-radius: 10px;
    margin-bottom: 24px;
    font-size: 14px;
    line-height: 1.5;
  }

  #loading { display: none; text-align: center; color: var(--text-dim); padding: 40px 0; }
  .spinner {
    width: 28px; height: 28px; margin: 0 auto 14px;
    border: 3px solid var(--border);
    border-top-color: var(--cyan);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  #results { display: none; }

  .section-label {
    color: var(--cyan);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  .summary-text { line-height: 1.7; font-size: 15.5px; color: var(--text); }

  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 16px; }
  .stat-card {
    background: #050810;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px;
  }
  .stat-title { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 8px; }
  .stat-icon { display: inline-flex; width: 16px; height: 16px; color: var(--cyan); flex-shrink: 0; }
  .stat-icon svg { width: 100%; height: 100%; }
  .stat-value { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
  .stat-value.pos { color: var(--green); }
  .stat-value.neg { color: var(--amber); }

  .status-pill {
    display: inline-block;
    font-size: 13px;
    font-weight: 700;
    padding: 5px 14px;
    border-radius: 999px;
    margin-bottom: 8px;
  }
  .status-pill.green { background: rgba(94, 224, 165, 0.15); color: var(--green); border: 1px solid rgba(94, 224, 165, 0.35); }
  .status-pill.amber { background: rgba(240, 185, 94, 0.15); color: var(--amber); border: 1px solid rgba(240, 185, 94, 0.35); }
  .status-pill.red { background: rgba(240, 125, 125, 0.15); color: var(--red); border: 1px solid rgba(240, 125, 125, 0.35); }
  .stat-detail { font-size: 13px; color: var(--text-dim); line-height: 1.5; }

  .benefit-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
  .benefit-card {
    background: #050810;
    border: 1px solid var(--border);
    border-left: 3px solid var(--border);
    border-radius: 10px;
    padding: 16px 18px;
  }
  .benefit-card.eligible { border-left-color: var(--green); }
  .benefit-card.not-eligible { border-left-color: var(--border); opacity: 0.55; }
  .benefit-name { font-weight: 700; font-size: 14.5px; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
  .badge {
    font-size: 10px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 999px;
    letter-spacing: 0.05em;
  }
  .badge.yes { background: rgba(94, 224, 165, 0.15); color: var(--green); }
  .badge.no { background: rgba(140, 155, 181, 0.12); color: var(--text-dim); }
  .benefit-detail { font-size: 13px; color: var(--text-dim); line-height: 1.55; }

  @keyframes reveal-up {
    from { opacity: 0; transform: translateY(18px); }
    to { opacity: 1; transform: translateY(0); }
  }
  #results .panel,
  .stat-card,
  .benefit-card {
    opacity: 0;
  }
  #results .panel.reveal,
  .stat-card.reveal,
  .benefit-card.reveal {
    animation: reveal-up 0.55s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }
  @media (prefers-reduced-motion: reduce) {
    #results .panel,
    .stat-card,
    .benefit-card {
      opacity: 1;
      animation: none;
    }
  }

  @media print {
    :root {
      --bg: #ffffff;
      --bg-panel: #ffffff;
      --border: #cccccc;
      --cyan: #0f7a8c;
      --cyan-dim: #0f7a8c;
      --text: #111111;
      --text-dim: #444444;
      --green: #146c3e;
      --amber: #8a5a00;
      --red: #a8281f;
    }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    body { background: #fff; }
    #inputPanel, #error, #loading, .export-row { display: none !important; }
    #results .panel,
    .stat-card,
    .benefit-card {
      opacity: 1 !important;
      animation: none !important;
      transform: none !important;
    }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Vyapar Mitra</h1>
    </header>

    <div class="panel" id="inputPanel">
      <div class="section-label">Describe your business</div>
      <p class="field-tip">Include your business type, approximate yearly revenue and expenses, and location for the most accurate result.</p>
      <textarea id="description" placeholder="e.g. I run a small tailoring shop in Lucknow, mostly stitching and alterations. I make about 35,000 rupees a month and spend about 15,000 rupees a month on materials and rent, mostly cash, one helper works with me."></textarea>
      <div class="examples">
        <button class="chip" data-example="I run a small tailoring shop in Lucknow, mostly stitching and alterations. I make about 35,000 rupees a month and spend about 15,000 rupees a month on materials and rent. Mostly cash, one helper works with me.">Tailoring shop</button>
        <button class="chip" data-example="I'm a freelance graphic designer working from home in Bengaluru. Most clients pay via UPI or bank transfer. I earn around 9 lakh rupees a year and spend about 1.5 lakh rupees a year on subscriptions and internet.">Freelance designer</button>
        <button class="chip" data-example="We run a small roadside tea and snacks stall in a village in Himachal Pradesh. Daily sales are around 2000 rupees and daily expenses are about 2,200 rupees on ingredients and gas, all cash. Just me and my brother.">Roadside tea stall</button>
        <button class="chip" data-example="I run a small manufacturing unit making plastic packaging in Pune with 8 workers, machinery worth about 40 lakh rupees, and annual turnover of 1.8 crore. Total annual expenses are about 1.2 crore.">Small manufacturer</button>
      </div>
      <div class="row">
        <button class="primary" id="submitBtn">Get My Advisory →</button>
      </div>
    </div>

    <div id="error"></div>

    <div id="loading">
      <div class="spinner"></div>
      <div>Reading your business description…</div>
    </div>

    <div id="results">
      <div class="panel">
        <div class="section-label">Plain-Language Summary</div>
        <div class="summary-text" id="summaryText"></div>
      </div>

      <div class="panel">
        <div class="section-label">Registration &amp; Tax Bracket</div>
        <div class="stat-grid" id="statGrid"></div>
      </div>

      <div class="panel">
        <div class="section-label">Benefits You'd Unlock</div>
        <div class="benefit-grid" id="benefitGrid"></div>
      </div>

      <div class="export-row">
        <button class="secondary" id="exportPdfBtn">Export as PDF</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
